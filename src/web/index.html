<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATC Ground</title>
    <!-- No icon yet; an empty one stops the browser's /favicon.ico request (a 404 in the console). -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: rgba(13, 17, 23, 0.88);
        --text: #d5dde6;
        --dim: #8b97a6;
        --edge: #2c3540;
        --accent: #4aa3ff;
        --error: #ff7b72;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        --side: 400px;
      }
      /* The map leaves the right-hand side to the game panel. */
      .map {
        position: fixed;
        inset: 0 var(--side) 0 0;
      }
      /* The session-ended banner (session-end.ts): over the map, which keeps drawing and panning under it. */
      .map .ended {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 70%;
        padding: 10px 16px;
        background: rgba(58, 18, 18, 0.94);
        border: 1px solid var(--error);
        border-radius: 6px;
        pointer-events: none;
        z-index: 2;
      }
      .map .ended h2 {
        margin: 0 0 4px;
        font-size: 16px;
        color: var(--error);
      }
      .map .ended p {
        margin: 2px 0;
      }
      .side {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: var(--side);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        background: #0a0e14;
        border-left: 1px solid var(--edge);
      }
      .side button {
        font: inherit;
        color: var(--text);
        background: #1b2430;
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 2px 8px;
        cursor: pointer;
      }
      .side button.on {
        border-color: var(--accent);
        color: var(--accent);
      }
      .side .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--edge);
      }
      .side .bar h1 {
        flex: 1 1 100%;
        margin: 0;
        font-size: 14px;
      }
      .side .clock {
        font: bold 16px ui-monospace, Menlo, monospace;
        min-width: 7.5em;
      }
      .side .clock.paused {
        color: #f5c518;
      }
      .side .speeds {
        display: flex;
        gap: 4px;
      }
      .side .counters {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        margin: 0;
        padding: 8px 10px;
        border-bottom: 1px solid var(--edge);
        font-size: 13px;
      }
      .side .counters dt {
        color: var(--dim);
      }
      .side .counters dd {
        margin: 0;
        font-family: ui-monospace, Menlo, monospace;
      }
      .side .fatal {
        margin: 0;
        padding: 6px 10px;
        background: #3a1212;
        color: var(--error);
      }
      .side .log {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 6px 10px;
        list-style: none;
        font: 12px/1.45 ui-monospace, Menlo, monospace;
      }
      .side .log time {
        color: var(--dim);
      }
      .side .log .pilot {
        color: #d5dde6;
      }
      .side .log .tower {
        color: #ffb454;
      }
      .side .log .unable {
        color: var(--error);
      }
      .side .log .info {
        color: #7fd1a7;
      }
      .side .log .player {
        color: var(--accent);
      }
      .side .console {
        padding: 8px 10px;
        border-top: 1px solid var(--edge);
      }
      .side .console input {
        box-sizing: border-box;
        width: 100%;
        font: 14px ui-monospace, Menlo, monospace;
        color: var(--text);
        background: #111821;
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 6px 8px;
      }
      .side .console input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .side .console .error {
        margin: 4px 0 0;
        color: var(--error);
        font: 12px ui-monospace, Menlo, monospace;
      }
      .side .console .hint {
        margin: 4px 0 0;
        color: var(--dim);
        font-size: 11px;
      }
      .map-canvas {
        display: block;
        cursor: grab;
        touch-action: none;
      }
      .map-canvas.dragging {
        cursor: grabbing;
      }
      /* Bottom-left: the corner a north-up airport usually leaves empty (KJFK's top-left has the penalty box). */
      .legend {
        position: fixed;
        bottom: 12px;
        left: 12px;
        max-width: 300px;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 6px;
      }
      .legend h1 {
        margin: 0 0 2px;
        font-size: 15px;
      }
      .legend p {
        margin: 4px 0;
      }
      .legend ul {
        margin: 6px 0;
        padding: 0;
        list-style: none;
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }
      .legend .swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex: none;
      }
      .legend .hint,
      .legend .license {
        color: var(--dim);
        font-size: 12px;
      }
      .legend button {
        margin-top: 4px;
        font: inherit;
        color: var(--text);
        background: #1b2430;
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
      }
      .error {
        max-width: 720px;
        margin: 15vh auto 0;
        padding: 0 16px;
      }
      .error h1 {
        font-size: 22px;
      }
      .error .message {
        color: var(--error);
        font-size: 16px;
      }
      .error .issues {
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        color: var(--dim);
      }
      .error a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
