<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATC Ground</title>
    <!-- No icon yet; an empty one stops the browser's /favicon.ico request (a 404 in the console). -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: rgba(13, 17, 23, 0.88);
        --text: #d5dde6;
        --dim: #8b97a6;
        --edge: #2c3540;
        --accent: #4aa3ff;
        --error: #ff7b72;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, sans-serif;
      }
      #app,
      .map {
        position: fixed;
        inset: 0;
      }
      .map-canvas {
        display: block;
        cursor: grab;
        touch-action: none;
      }
      .map-canvas.dragging {
        cursor: grabbing;
      }
      /* Bottom-left: the corner a north-up airport usually leaves empty (KJFK's top-left has the penalty box). */
      .legend {
        position: fixed;
        bottom: 12px;
        left: 12px;
        max-width: 300px;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 6px;
      }
      .legend h1 {
        margin: 0 0 2px;
        font-size: 15px;
      }
      .legend p {
        margin: 4px 0;
      }
      .legend ul {
        margin: 6px 0;
        padding: 0;
        list-style: none;
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }
      .legend .swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex: none;
      }
      .legend .hint,
      .legend .license {
        color: var(--dim);
        font-size: 12px;
      }
      .legend button {
        margin-top: 4px;
        font: inherit;
        color: var(--text);
        background: #1b2430;
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
      }
      .error {
        max-width: 720px;
        margin: 15vh auto 0;
        padding: 0 16px;
      }
      .error h1 {
        font-size: 22px;
      }
      .error .message {
        color: var(--error);
        font-size: 16px;
      }
      .error .issues {
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        color: var(--dim);
      }
      .error a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
